<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1a14">
<title>Plant Guard</title>
<style>
  :root {
    --bg: #0f1a14; --card: #17261d; --line: #2a3d31; --text: #e8f0ea; --muted: #93a89a;
    --green: #4cc38a; --blue: #5aa9e6; --amber: #e6b35a; --red: #e66a5a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.4 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
         background: var(--bg); color: var(--text); padding: 16px 16px 40px; max-width: 560px; margin-inline: auto; }
  h1 { font-size: 20px; margin: 4px 0 2px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 16px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; background: var(--muted); }
  .dot.on { background: var(--green); } .dot.off { background: var(--red); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  .value { font-size: 26px; font-weight: 600; margin-top: 2px; }
  .value small { font-size: 14px; color: var(--muted); font-weight: 400; }
  .ok { color: var(--green); } .bad { color: var(--red); } .warn { color: var(--amber); }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .controls { margin-top: 10px; display: grid; gap: 10px; }
  button { font: inherit; border: 0; border-radius: 10px; padding: 12px 14px; cursor: pointer; }
  .primary { background: var(--blue); color: #08131c; font-weight: 600; width: 100%; }
  .primary:disabled { opacity: .5; cursor: default; }
  .ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); padding: 6px 10px; font-size: 13px; }
  .switch { position: relative; width: 52px; height: 30px; flex: none; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider { position: absolute; inset: 0; background: var(--line); border-radius: 30px; transition: .2s; }
  .slider:before { content: ""; position: absolute; width: 24px; height: 24px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .2s; }
  .switch input:checked + .slider { background: var(--green); }
  .switch input:checked + .slider:before { transform: translateX(22px); }
  h2 { font-size: 14px; color: var(--muted); margin: 20px 0 8px; font-weight: 600; }
  svg { width: 100%; height: auto; display: block; }
  .legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); margin-top: 6px; }
  .legend span:before { content: ""; display: inline-block; width: 10px; height: 3px; margin-right: 5px; vertical-align: middle; background: currentColor; }
  .events { list-style: none; padding: 0; margin: 0; }
  .events li { padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .events li:last-child { border-bottom: 0; }
  .events time { color: var(--muted); font-size: 12px; display: block; }
  .banner { padding: 10px 12px; border-radius: 10px; margin-bottom: 12px; font-size: 14px; display: none; }
  .banner.show { display: block; }
  .banner.err { background: #3a1d1a; color: #ffc9c2; }
  .banner.info { background: #1b2d3a; color: #cfe6f8; }
  form { display: grid; gap: 10px; margin-top: 24px; }
  input[type=email], input[type=password] { font: inherit; padding: 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--text); }
  .hidden { display: none !important; }
</style>
</head>
<body>

<h1>Plant Guard</h1>
<div class="sub" id="status"><span class="dot" id="onlineDot"></span><span id="onlineText">Loading...</span></div>
<div class="banner err" id="errBanner"></div>
<div class="banner info" id="infoBanner"></div>

<!-- Login -->
<form id="loginForm" class="hidden">
  <div class="label">Log in</div>
  <input type="email" id="email" placeholder="Email" autocomplete="username" required>
  <input type="password" id="password" placeholder="Password" autocomplete="current-password" required>
  <button class="primary" type="submit">Log in</button>
</form>

<!-- Dashboard -->
<main id="app" class="hidden">
  <div class="grid">
    <div class="card"><div class="label">Soil moisture</div><div class="value" id="soil">--</div></div>
    <div class="card"><div class="label">Tank</div><div class="value" id="tank">--</div></div>
    <div class="card"><div class="label">Temperature</div><div class="value" id="temp">--</div></div>
    <div class="card"><div class="label">Humidity</div><div class="value" id="hum">--</div></div>
  </div>

  <div class="controls">
    <div class="card row">
      <div>
        <div style="font-weight:600">Auto watering</div>
        <div class="label" id="autoNote" style="text-transform:none;letter-spacing:0">--</div>
      </div>
      <label class="switch"><input type="checkbox" id="autoToggle"><span class="slider"></span></label>
    </div>
    <button class="primary" id="waterBtn">Water now (one 3 s shot)</button>
  </div>

  <h2>Last 24 hours</h2>
  <div class="card">
    <svg id="chart" viewBox="0 0 340 170" role="img" aria-label="Soil moisture and temperature, last 24 hours"></svg>
    <div class="legend"><span style="color:var(--green)">Soil %</span><span style="color:var(--amber)">Temp °C</span><span style="color:var(--blue)">Pump ran</span></div>
  </div>

  <h2>Recent events</h2>
  <div class="card"><ul class="events" id="events"><li>--</li></ul></div>

  <div class="row" style="margin-top:16px">
    <span class="label" id="updated" style="text-transform:none;letter-spacing:0"></span>
    <button class="ghost" id="logoutBtn">Log out</button>
  </div>
</main>

<script type="module">
// ===== Fill these in (same values as the firmware) =====
const SUPABASE_URL = "https://YOURPROJECT.supabase.co";
const SUPABASE_KEY = "sb_publishable_xxxxxxxxxxxxxxxx";   // publishable key only, never the secret key
const DEVICE_ID    = "plant-guard-1";
// =======================================================

import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const ONLINE_MINUTES = 11;        // device uploads every 5 min; > 11 min silent = offline
const REFRESH_MS = 30000;

const $ = (id) => document.getElementById(id);
const sb = createClient(SUPABASE_URL, SUPABASE_KEY);
let refreshTimer = null;
let latestSettings = null;

function showError(msg) { const b = $("errBanner"); b.textContent = msg; b.classList.toggle("show", !!msg); }
function showInfo(msg)  { const b = $("infoBanner"); b.textContent = msg; b.classList.toggle("show", !!msg); }

function ago(ts) {
  const s = Math.round((Date.now() - new Date(ts).getTime()) / 1000);
  if (s < 60) return `${s}s ago`;
  if (s < 3600) return `${Math.round(s / 60)} min ago`;
  if (s < 86400) return `${Math.round(s / 3600)} h ago`;
  return new Date(ts).toLocaleString();
}

function timeLabel(ts) {
  return new Date(ts).toLocaleString([], { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
}

async function load() {
  const since = new Date(Date.now() - 24 * 3600 * 1000).toISOString();
  const [latestRes, histRes, evRes, setRes] = await Promise.all([
    sb.from("readings").select("*").eq("device_id", DEVICE_ID).order("created_at", { ascending: false }).limit(1),
    sb.from("readings").select("created_at,soil_pct,temp_c,pump_on").eq("device_id", DEVICE_ID)
      .gte("created_at", since).order("created_at", { ascending: true }).limit(2000),
    sb.from("events").select("created_at,type,message").eq("device_id", DEVICE_ID)
      .order("created_at", { ascending: false }).limit(15),
    sb.from("device_settings").select("auto_enabled,water_now_at").eq("device_id", DEVICE_ID).maybeSingle(),
  ]);
  const err = latestRes.error || histRes.error || evRes.error || setRes.error;
  if (err) { showError("Couldn't load data: " + err.message); return; }
  showError("");

  renderLatest(latestRes.data[0]);
  renderChart(histRes.data);
  renderEvents(evRes.data);
  latestSettings = setRes.data;
  if (latestSettings) $("autoToggle").checked = latestSettings.auto_enabled;
  $("updated").textContent = "Updated " + new Date().toLocaleTimeString();
}

function renderLatest(r) {
  if (!r) {
    $("onlineDot").className = "dot off";
    $("onlineText").textContent = "No readings yet. Is the ESP32 on and connected?";
    return;
  }
  const minutes = (Date.now() - new Date(r.created_at).getTime()) / 60000;
  const online = minutes < ONLINE_MINUTES;
  $("onlineDot").className = "dot " + (online ? "on" : "off");
  $("onlineText").textContent = (online ? "Online" : "Offline") + " · last reading " + ago(r.created_at);

  $("soil").innerHTML = r.soil_pct != null ? `${r.soil_pct}<small>%</small>` : "--";
  $("soil").className = "value " + (r.soil_pct == null ? "" : r.soil_pct < 35 ? "warn" : "ok");
  $("tank").textContent = r.water_ok == null ? "--" : r.water_ok ? "OK" : "LOW";
  $("tank").className = "value " + (r.water_ok ? "ok" : "bad");
  $("temp").innerHTML = r.temp_c != null ? `${Number(r.temp_c).toFixed(1)}<small>°C</small>` : "--";
  $("hum").innerHTML = r.humidity != null ? `${Number(r.humidity).toFixed(0)}<small>%</small>` : "--";

  let note = r.auto_enabled ? "On" : "Off";
  if (r.fault) note = "Stopped: soil stayed dry. Check sensor and tube, then switch off and on.";
  else if (r.pump_on) note += " · pump running";
  $("autoNote").textContent = note;
  $("autoNote").className = "label " + (r.fault ? "bad" : "");
}

function renderChart(rows) {
  const svg = $("chart");
  const W = 340, H = 170, L = 30, R = 30, T = 10, B = 24;
  const x0 = Date.now() - 24 * 3600 * 1000, x1 = Date.now();
  const X = (t) => L + (new Date(t).getTime() - x0) / (x1 - x0) * (W - L - R);
  const Ysoil = (v) => T + (1 - v / 100) * (H - T - B);
  const Ytemp = (v) => T + (1 - (v - 15) / 30) * (H - T - B);   // 15-45 °C scale
  let s = "";
  for (const v of [0, 50, 100]) {
    s += `<line x1="${L}" x2="${W - R}" y1="${Ysoil(v)}" y2="${Ysoil(v)}" stroke="#2a3d31"/>`;
    s += `<text x="${L - 4}" y="${Ysoil(v) + 4}" fill="#4cc38a" font-size="10" text-anchor="end">${v}</text>`;
  }
  for (const v of [15, 30, 45]) {
    s += `<text x="${W - R + 4}" y="${Ytemp(v) + 4}" fill="#e6b35a" font-size="10">${v}</text>`;
  }
  for (let h = 0; h <= 24; h += 6) {
    const t = x0 + h * 3600 * 1000;
    const lbl = new Date(t).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    s += `<text x="${X(t)}" y="${H - 6}" fill="#93a89a" font-size="10" text-anchor="middle">${lbl}</text>`;
  }
  if (rows.length) {
    for (const r of rows.filter((r) => r.pump_on)) {
      s += `<line x1="${X(r.created_at)}" x2="${X(r.created_at)}" y1="${T}" y2="${H - B}" stroke="#5aa9e6" stroke-opacity=".5"/>`;
    }
    const soil = rows.filter((r) => r.soil_pct != null).map((r) => `${X(r.created_at).toFixed(1)},${Ysoil(r.soil_pct).toFixed(1)}`);
    const temp = rows.filter((r) => r.temp_c != null).map((r) => `${X(r.created_at).toFixed(1)},${Ytemp(r.temp_c).toFixed(1)}`);
    if (temp.length) s += `<polyline points="${temp.join(" ")}" fill="none" stroke="#e6b35a" stroke-width="1.5"/>`;
    if (soil.length) s += `<polyline points="${soil.join(" ")}" fill="none" stroke="#4cc38a" stroke-width="2"/>`;
  } else {
    s += `<text x="${W / 2}" y="${H / 2}" fill="#93a89a" font-size="12" text-anchor="middle">No readings in the last 24 h</text>`;
  }
  svg.innerHTML = s;
}

function renderEvents(list) {
  const ul = $("events");
  ul.innerHTML = "";
  if (!list.length) { ul.innerHTML = "<li>No events yet</li>"; return; }
  for (const e of list) {
    const li = document.createElement("li");
    const t = document.createElement("time");
    t.textContent = timeLabel(e.created_at);
    li.appendChild(t);
    li.appendChild(document.createTextNode(e.message || e.type));
    if (["low_water", "fault", "manual_blocked"].includes(e.type)) li.className = "bad";
    ul.appendChild(li);
  }
}

async function setAuto(on) {
  const { error } = await sb.from("device_settings")
    .update({ auto_enabled: on, updated_at: new Date().toISOString() }).eq("device_id", DEVICE_ID);
  if (error) { showError("Couldn't change Auto: " + error.message); $("autoToggle").checked = !on; return; }
  showInfo(`Auto ${on ? "on" : "off"} sent. The plant picks it up within about 15 s.`);
  setTimeout(() => showInfo(""), 6000);
}

async function waterNow() {
  const btn = $("waterBtn");
  btn.disabled = true;
  const { error } = await sb.from("device_settings")
    .update({ water_now_at: new Date().toISOString(), updated_at: new Date().toISOString() }).eq("device_id", DEVICE_ID);
  if (error) { showError("Couldn't send Water now: " + error.message); btn.disabled = false; return; }
  showInfo("Water now sent. The pump runs within about 15 s if the tank has water.");
  setTimeout(() => { btn.disabled = false; showInfo(""); load(); }, 15000);
}

function startApp() {
  $("loginForm").classList.add("hidden");
  $("app").classList.remove("hidden");
  load();
  clearInterval(refreshTimer);
  refreshTimer = setInterval(load, REFRESH_MS);
}

function showLogin() {
  clearInterval(refreshTimer);
  $("app").classList.add("hidden");
  $("loginForm").classList.remove("hidden");
  $("onlineDot").className = "dot";
  $("onlineText").textContent = "Log in to see your plant";
}

$("loginForm").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const { error } = await sb.auth.signInWithPassword({ email: $("email").value.trim(), password: $("password").value });
  if (error) { showError("Login failed: " + error.message); return; }
  showError("");
  startApp();
});
$("logoutBtn").addEventListener("click", async () => { await sb.auth.signOut(); showLogin(); });
$("autoToggle").addEventListener("change", (e) => setAuto(e.target.checked));
$("waterBtn").addEventListener("click", waterNow);
document.addEventListener("visibilitychange", () => { if (!document.hidden && !$("app").classList.contains("hidden")) load(); });

const { data: { session } } = await sb.auth.getSession();
if (session) startApp(); else showLogin();
</script>
</body>
</html>
